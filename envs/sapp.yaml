name: sapp
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - snakemake
  - pandas
  - numpy
  - scipy
  - biopython
  - ncbi-datasets-cli
  - unzip
  - mmseqs2
  - mafft
  - trimal
  - iqtree      # ML
  - quicktree   # NJ
  - fasttree    # NJ/ML substitute
  - raxml-ng    # MP
  - pip
  # NOTE: fasturec must be installed manually from source (see README)
  - pip:
    - requests
